name: Python syntax check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every Python file
        run: |
          python -c "import pathlib, py_compile; files=list(pathlib.Path('.').rglob('*.py')); [py_compile.compile(str(p), doraise=True) for p in files]; print('Syntax OK:', len(files), 'Python files')"
