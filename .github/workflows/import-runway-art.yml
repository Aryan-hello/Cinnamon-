name: Save Cinnamon Runway artwork

on:
  push:
    paths:
      - 'tools/runway_art_urls.txt'
      - 'tools/import_runway_art.py'
      - '.github/workflows/import-runway-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save_existing_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install 'Pillow>=10,<13'
      - name: Download existing Runway artwork into this repository
        id: import
        continue-on-error: true
        run: python tools/import_runway_art.py
      - name: Save the copied assets for future deployments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/wildlands/
          if git diff --cached --quiet; then
            echo 'No new artwork downloaded.'
          else
            git commit -m 'Save existing Runway Wildlands artwork for Cinnamon'
            git push
          fi
      - name: Report incomplete imports
        if: steps.import.outcome == 'failure'
        run: |
          echo 'Some image URLs could not be downloaded. Successfully downloaded files have still been committed.'
          exit 1
