name: Cinnamon integrity and Wildlands checks

on:
  push:
    branches:
      - main
      - "feature/**"
      - "cleanup/**"
  pull_request:
    paths:
      - "main.py"
      - "dashboard.py"
      - "cinnamon_modules/**"
      - "static/**"
      - "Static/**"
      - "tests/**"
      - ".github/workflows/wildlands-checks.yml"

permissions:
  contents: read

jobs:
  story-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q main.py dashboard.py cinnamon_modules tests
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline gameplay checks
        run: python -m unittest discover -s tests -v

